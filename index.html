    <div class=vspace> </div>
    <br>
    <!-- <h2 align="center">Abstract</h2> -->
    <P align="justify">
        <!-- This paper proposes an energy-based generative
      video modeling framework with hierarchical latent variables for
      learning complex spatiotemporal dynamics. Conventional latent
      variable models typically rely on fixed Gaussian priors, whose
      limited expressive capacity poses significant challenges in modeling complex dynamic patterns in videos and time-series data.
      To overcome the representational limitations of fixed Gaussian
      priors, we introduce layer-wise energy functions for each latent
      variable, enabling the capture of intra-layer contextual structures
      while jointly modeling and correcting the dependencies across
      different layers of latent variables. In addition, we employ shortrun MCMC as the inference engine for latent variables, using
      a finite number of Langevin dynamics steps to approximate the
      posterior distribution, thereby avoiding the need for separate
      inference networks such as variational encoders. Experimental
      results demonstrate that the proposed method significantly outperforms variational autoencoder (VAE)-based generative models
      in terms of generation quality and temporal consistency.  -->
    </P>
